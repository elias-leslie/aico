# One pytest run for the repo's Python: the web backend's suite (web/tests,
# needs web/.venv) and Tether's operator-script tests (tether/scripts/tests,
# stdlib + pytest only). `st check` runs it from the root with web/.venv.
[pytest]
testpaths = web/tests tether/scripts/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    asyncio: mark tests that await async code
filterwarnings =
    # slowapi 0.1.9 uses deprecated asyncio.iscoroutinefunction (removed in 3.16)
    ignore:'asyncio.iscoroutinefunction':DeprecationWarning:slowapi
