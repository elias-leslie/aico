name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      A_TERM_BIND_HOST: 127.0.0.1
      A_TERM_AUTH_MODE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Ruff
        run: uv run ruff check .

      - name: Ty
        run: uv run ty check

      - name: Pytest
        run: uv run pytest -q

      # Public CI cannot consume the host-level SummitFlow dt wrapper yet.
      # Keep explicit repo-local commands here until dt has a real install path.
      - name: Biome
        run: pnpm --dir frontend exec biome check . --max-diagnostics=100

      - name: TypeScript
        run: pnpm --dir frontend exec tsc --noEmit

      - name: Vitest
        run: pnpm --dir frontend exec vitest run

      - name: Frontend build
        run: pnpm --dir frontend build

      - name: Python build
        run: uv build
