<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Aico lantern orb icon</title>
  <desc id="desc">A warm amber lantern glow inside a dark rounded app icon, with a terminal prompt in the light.</desc>
  <defs>
    <radialGradient id="orb-halo" cx="50%" cy="57%" r="56%">
      <stop offset="0" stop-color="#FFE3A3" stop-opacity="0.92" />
      <stop offset="0.34" stop-color="#E5A647" stop-opacity="0.74" />
      <stop offset="0.68" stop-color="#9E6121" stop-opacity="0.28" />
      <stop offset="1" stop-color="#0B0D11" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="amber-shell" x1="160" y1="92" x2="352" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE1A0" />
      <stop offset="0.48" stop-color="#E5A647" />
      <stop offset="1" stop-color="#8A551F" />
    </linearGradient>
    <linearGradient id="glass" x1="184" y1="164" x2="328" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF0C5" />
      <stop offset="0.58" stop-color="#E5A647" />
      <stop offset="1" stop-color="#B87725" />
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.48  0 0 1 0 0.12  0 0 0 0.82 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="#0B0D11" />
