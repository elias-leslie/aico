org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Aico's public origin: always on the app's allowed-links list, beside the origins its pairing named.
aico.origin=https://aico.summitflow.dev

# The app's version. The self-updater installs home's build only when its versionCode is higher than this one.
aico.versionCode=15
aico.versionName=0.3.2
