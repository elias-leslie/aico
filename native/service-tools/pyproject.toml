[project]
name = "aico-service-tools"
version = "0.1.0"
description = "Standalone project service lifecycle for the Aico CLI"
requires-python = ">=3.13"
dependencies = ["summitflow-st-sdk", "python-dotenv>=1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aico_service"]

[tool.uv.sources]
summitflow-st-sdk = { path = "../st-sdk" }

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
