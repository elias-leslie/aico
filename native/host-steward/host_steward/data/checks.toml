[checks.tripwire]
what = "Login and listener changes"
every_min = 15
slack_min = 10
# Host names as the declarations and baselines know them, and the words the rows use for them.
hosts = { workstation = "davion-sidarli", pve = "davion-gem" }
labels = { workstation = "the workstation", pve = "the PVE host" }
dpkg_log = "/var/log/dpkg.log"
cloudflared_config = "/etc/cloudflared/config.yml"
# A daemon that comes back within this long after a boot is boot noise.
boot_window_min = 45
# Most explained-change notes one row carries.
notes_max = 3

[checks.sudo]
what = "Sudo use"
every_min = 15
slack_min = 10
host = "davion-sidarli"
notes_max = 3
initial_since = "-14d"
# The sudo binaries whose journal lines count (the journal's _EXE of the line). This host runs sudo-rs; a filter on
# /usr/bin/sudo alone saw no calls at all (Nightshift reads 0 a day since 2026-10-25).
sudo_exes = ["/usr/bin/sudo", "/usr/bin/sudo.ws", "/usr/lib/cargo/bin/sudo"]
# Baseline: the 24h total is judged against the median of earlier 24h windows once learn_days are stored (seed until then).
learn_days = 3
seed_daily_total = 620
spike_factor = 2.0
spike_min_extra = 1000
family_spike_factor = 3.0
family_spike_min = 150
# Families that never count as new or spiking (host tools whose volume follows their timers). Globs.
known_families = [
  "nightshift-checks check", "nightshift-checks check *", "nightshift-checks journal-signatures",
  "host-steward check", "host-steward check *", "host-steward collect-usage",
]
# Extra exact caller unit names that are scheduled automation (the site's trusted units always count).
automation_units = []
# Commands that touch these are sensitive (a write is a problem unless an agent or a declaration explains it).
sensitive = '''/etc/sudoers|visudo|/etc/ssh/|sshd_config|/etc/pam\.d|authorized_keys|pam-auth-update'''
# Tools whose first non-option word is a subcommand (the family is "tool sub").
subcommand_tools = [
  "nightshift-checks", "host-steward", "btrfs", "systemctl", "apt", "apt-get", "dpkg", "snap", "ufw", "ip", "docker",
  "pct", "qm", "zfs", "lvm", "journalctl", "loginctl", "machinectl", "nmcli", "update-alternatives", "flatpak", "git",
]
# The host's own root tools. reads: subcommands that only read. free_text: options whose values are prose (a note
# naming /etc/sudoers.d touches nothing).
[checks.sudo.own_tools."/usr/local/sbin/nightshift-checks"]
reads = ["check", "journal-signatures", "collect-usage"]
free_text = ["--note", "--reason"]

[checks.sudo.own_tools."/usr/local/bin/host-steward"]
reads = ["check", "collect-usage", "declare", "lab-use"]
free_text = ["--note", "--reason"]

[checks.security]
what = "Docker access"
every_min = 15
slack_min = 10
group_file = "/etc/group"
socket = "/var/run/docker.sock"

# --- PVE guests, the asset registry and trends (F2: ns-01 leftovers, ns-23) -------------------------------------------

# Site values for the guest/asset checks. lan_bridges: PVE bridges that are the home LAN; lab_vlans: VLAN tags on them
# that count as off the LAN (tag 1 never does). lab_use_files: where agent sessions declare they use a parked machine
# (`host-steward declare`, and Nightshift's own file until cutover); the registry reads them as root.
[site.assets]
lan_bridges = ["vmbr0"]
lab_vlans = []
lab_use_files = ["/var/lib/host-steward/agent-hints/lab-use.json", "/var/lib/nightshift/agent-hints/lab-use.json"]

# An isolated lab segment: its bridge must never be up without its nftables filter table.
[[site.segment_guards]]
bridge = "labnet"
nft_table = "inet lab_isolation"

[checks.guests]
what = "PVE guests"
every_min = 15
slack_min = 10
# The thin-pool storage whose VM disks should have discard on (so freed space returns to the pool).
pool_storage = "local-lvm"
guest_disk_warn_pct = 85.0
guest_disk_crit_pct = 95.0
# The guests and their start/stop history, saved beside the state file for the probes check.
guests_file = "pve-guests.json"

[checks.assets]
what = "Asset registry"
every_min = 15
slack_min = 10
# A parked machine running with no lab-use declaration and no automation start: a warning, and a failure once it has
# been that way this long (sooner when it holds data).
unexplained_hours = 12.0
unexplained_data_hours = 1.0

# Trends over the daily readings the pve, storage, ecc and guests checks record (/var/lib/host-steward/history.sqlite3).
# On its first run the check copies Nightshift's daily history once (read-only) so projections start with their weeks of
# data. A spec's host is a site role; severity is the state of a worsening verdict; the tier step (assets.toml classes)
# raises data signals to failed on a host that holds data. Rule kinds are in trend.py.
[checks.trends]
what = "Trends"
every_min = 15
slack_min = 10
names = { pve = "PVE host", workstation = "Workstation" }

[checks.trends.seed]
source = "/var/lib/nightshift/history.sqlite3"
mark = "seed:nightshift"
hosts = { davion-gem = "pve", davion-sidarli = "workstation" }
metrics = [
  "disk.media_errors", "disk.spare_used_pct", "disk.wear_pct", "disk.realloc", "disk.pending", "disk.used_pct",
  "pool.data_pct", "pool.meta_pct", "guest.disk_used_pct", "mem.ce", "mem.ce_overflow", "mem.ue",
]

[[checks.trends.specs]]
code = "pve.ecc.trend"
host = "pve"
label = "memory"
severity = "failed"
digest_always = true
rules = [
  { metric = "mem.ce", kind = "rate", label = "corrected", factor = 2.0, floor = 10.0, hold_h = 72.0 },
  { metric = "mem.ce_overflow", kind = "rate", label = "Error_overflow", factor = 2.0, floor = 10.0 },
  { metric = "mem.ue", kind = "any", label = "uncorrected", hold_h = 72.0, push = false },
]

[[checks.trends.specs]]
code = "pve.smart.trend"
host = "pve"
label = "disks"
severity = "failed"
rules = [
  { metric = "disk.media_errors", kind = "counter", label = "media errors" },
  { metric = "disk.wear_pct", kind = "projection", label = "wear", limit = 100.0, horizon_days = 90.0, fmt = "{:.0f}%" },
  { metric = "disk.spare_used_pct", kind = "counter", label = "spare used", floor = 5.0, fmt = "{:.0f}%" },
]

[[checks.trends.specs]]
code = "storage.smart_trend"
host = "workstation"
label = "disks"
severity = "failed"
rules = [
  { metric = "disk.media_errors", kind = "counter", label = "media errors" },
  { metric = "disk.realloc", kind = "counter", label = "reallocated sectors" },
  { metric = "disk.pending", kind = "counter", label = "pending sectors" },
  { metric = "disk.wear_pct", kind = "projection", label = "wear", limit = 100.0, horizon_days = 90.0, fmt = "{:.0f}%" },
]

# limit = the pool's failed line (checks.pve thin_crit): a test keeps the two equal.
[[checks.trends.specs]]
code = "pve.thin.trend"
host = "pve"
label = "thin pool"
rules = [
  { metric = "pool.data_pct", kind = "projection", label = "data", limit = 92.0, horizon_days = 30.0, fmt = "{:.1f}%" },
  { metric = "pool.meta_pct", kind = "projection", label = "metadata", limit = 92.0, horizon_days = 30.0, fmt = "{:.1f}%" },
]

[[checks.trends.specs]]
code = "storage.disk_trend"
host = "workstation"
label = "disks"
rules = [
  { metric = "disk.used_pct", kind = "projection", label = "used", limit = 95.0, horizon_days = 21.0, critical_days = 3.0, fmt = "{:.0f}%", reset_drop = 3.0, robust = true },
]

# limit = checks.guests guest_disk_crit_pct.
[[checks.trends.specs]]
code = "pve.guest_disk_trend"
host = "pve"
label = "guest disks"
rules = [
  { metric = "guest.disk_used_pct", kind = "projection", label = "used", limit = 95.0, horizon_days = 21.0, critical_days = 3.0, fmt = "{:.0f}%", dim_name = "VM ", reset_drop = 3.0, robust = true },
]
