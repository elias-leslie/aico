# Host checks: settings, schedules and site values. Nothing here is code. The wording is in meanings.toml.
# every_min is how often a check is due; slack_min is added to it for the row's next_run (a row past
# next_run shows "late"). The timer fires every 15 minutes, so a check due less often waits for a later tick.

[site.owner]
user = "kasadis"

[site.pve]
name = "davion-gem"
addr = "192.168.86.39"
check_key = "/etc/host-steward/pve-check.key"
known_hosts = "/etc/host-steward/pve-known_hosts"
ssh_timeout = 120
backup_required_targets = ["pve-cluster-config", "pve-host-files", "pve-vm-100-browser-state"]

# Controllers that change the host (kill processes, delete scratch data, start scrubs and self-tests). Each is a
# dry run until its switch here is true: it reports what it would do and does nothing. Switching one off and
# rerunning install-root.sh disables its timers (scrub, nvme_tests).
[acting]
memctl = true
housekeeping = true
space_guard = true
scrub = true
nvme_tests = true
# The perf check clears stale swap itself (swapoff, swapon) when memory available beats what swap holds by a margin.
swap_clear = true

# Signals the owner decided are record-only: they stay in the row's text but never past this state.
# First matching pattern wins. GEM10 logs corrected memory errors without DRAM ECC (owner 2026-10-30).
[caps]
"ecc.corrected" = "ok"
# Corrected-rate jumps are also record-only on this non-ECC host (owner 2026-11-08).
"ecc.spike" = "ok"
# Long-term memory trends remain record-only; uncorrected errors still fail in the ECC check.
"pve.ecc.trend" = "ok"

[checks.workstation]
what = "Workstation health"
every_min = 15
slack_min = 10
owner_uid = 1000
transient_units = '''run-[urp][A-Za-z0-9_.-]{1,90}\.(service|scope)|app-[A-Za-z0-9](?:[A-Za-z0-9_.-]|\\x[0-9a-f]{2}){0,90}\.scope'''
reboot_flag = "/run/reboot-required"
swap_conf = "/etc/sysctl.d/60-aico-memory.conf"
proc_sys = "/proc/sys"
zswap_dir = "/sys/module/zswap/parameters"
zswap_expect = { enabled = "Y", compressor = "zstd", max_pool_percent = "25" }
journald_expect = { SystemMaxUse = "4G", MaxRetentionSec = "30day" }
psi_memory = "/proc/pressure/memory"
pressure_warn_full_pct = 2.0
pressure_warn_some_pct = 10.0
internet_probes = ["https://cloudflare.com/cdn-cgi/trace", "https://1.1.1.1/cdn-cgi/trace"]
tunnel_ready_url = "http://127.0.0.1:20241/ready"
cert_endpoints = ["app.summitflow.dev", "app.summitflow.dev@localhost:443"]
cert_warn_days = 21
cert_crit_days = 7

[checks.storage]
what = "Workstation storage"
every_min = 15
slack_min = 10
# SummitFlow stops backups below this much free space; the line the system disk is rated against.
reserve_gib = 25
warn_margin_gib = 15
capture_peak_gib = 5
critical_floor_gib = 10
alloc_trigger_gib = 8
alloc_target_gib = 12
alloc_free_warn_gib = 25
disk_crit_pct = 95.0
disk_crit_free_gib = 5.0
disk_crit_tight_pct = 92.0
disk_crit_tight_free_gib = 10.0
disk_warn_free_gib = 15.0
disk_warn_tight_pct = 85.0
disk_warn_tight_free_gib = 30.0
# Fill rate: hours until the reserve at the short and long window's pace (the pace is capped at the last
# fill_recent_hours'); the short window decides failed, either one warn. sample_keep_hours of free-space samples are kept.
fill_short_hours = 6
fill_long_hours = 24
fill_recent_hours = 1
fill_critical_hours = 12
fill_warning_hours = 48
sample_keep_hours = 48
# The space guard's report is old news after this long (reclaim and ballast notes are dropped).
guard_fresh_s = 7200
# The guard writes space-guard.json and growers.json in the jobs directory beside the state file.
# missing: the state when the disk is not mounted (default failed). balance: rate against the reserve.
disks = [
  { name = "System disk", path = "/", btrfs = true, balance = true },
  { name = "Backup drive (T7)", path = "/media/kasadis/Backups" },
  { name = "Host backup target", path = "/mnt/summitflow-native", btrfs = true, missing = "warn" },
]

[checks.perf]
what = "Workstation performance"
every_min = 15
slack_min = 10
owner_uid = 1000
meminfo = "/proc/meminfo"
crash_restarts_per_hour = 6
swap_used_pct = 80.0
swap_mem_available_gib = 8.0
# Swap this full while RAM is free is stale pages, not pressure: the check clears it when available memory exceeds the
# swap in use by this much and memory stalls (PSI some avg10, percent) are under the limit. The clear is in [acting].
swap_clear_headroom_gib = 4.0
swap_clear_max_psi = 5.0
swap_clear_timeout_s = 300
psi = "/proc/pressure/memory"

[checks.pve]
what = "PVE host health"
every_min = 15
slack_min = 10
thin_warn = 85.0
thin_crit = 92.0
vg_free_warn_gib = 10.0
reboot_pending_warn_days = 7

[checks.ecc]
what = "PVE memory errors"
# pve-sender owns this row. Keep its shared evaluator settings here.
run_on_host = false
every_min = 15
slack_min = 10
push_codes = ["ecc.uncorrected"]
spike_factor = 5.0
spike_min = 100
event_gap_s = 2.0
region_shift = 21
# Keep a note of newly seen corrected-error regions for this long; they do not fail the check.
hold_hours = 72

[checks.thermal]
what = "Temperatures"
every_min = 15
slack_min = 10
hwmon_root = "/sys/class/hwmon"
cpu_labels = ["Tctl", "Tdie", "Package id 0"]
gpu_warn = 90.0
gpu_crit = 96.0
crit_only_margin = 5.0
[checks.thermal.chips]
k10temp = { kind = "CPU", warn = 88.0, crit = 95.0 }
coretemp = { kind = "CPU", warn = 90.0, crit = 98.0 }
zenpower = { kind = "CPU", warn = 88.0, crit = 95.0 }
nvme = { kind = "NVMe", warn = 70.0, crit = 80.0 }
amdgpu = { kind = "AMD GPU", warn = 90.0, crit = 100.0 }

[checks.backups]
what = "Backups"
every_min = 15
slack_min = 10
# The owning live API computes per-source data age, failures and offline-unchanged coverage.
aico_status_command = ["curl", "--fail", "--silent", "--show-error", "--noproxy", "*", "http://127.0.0.1:3002/api/backups"]
# Read each configured Drive owner's receipts over Aico's existing fleet link, as the backup owner.
fleet_status_command = ["runuser", "-u", "kasadis", "--", "/home/kasadis/.local/bin/aico", "backups", "list", "--fleet", "--json"]
# Status's shown machine state includes deliberate power-off and planned outages.
machine_status_command = ["curl", "--fail", "--silent", "--show-error", "--noproxy", "*", "http://127.0.0.1:3002/api/status?kind=machine"]
status_timeout_s = 5.0
drive_stale_hours = 36.0
future_skew_s = 600.0
drill_status_command = ["curl", "--fail", "--silent", "--show-error", "--noproxy", "*", "http://127.0.0.1:3002/api/status?q=backups-drill"]
drill_job_id = "jobs/backups-drill"
# Preserve the previous monthly freshness window; the owning job checks the actual drill before reporting OK.
drill_stale_hours = 852.0
native_required_sources = ["root-volume", "home", "srv-workspaces", "var-lib-docker", "srv-models", "var-log"]
native_warn_hours = 36
native_failed_hours = 60
snapshot_status_command = ["curl", "--fail", "--silent", "--show-error", "--noproxy", "*", "http://127.0.0.1:3002/api/status?q=backups-snapshots"]
snapshot_job_id = "jobs/backups-snapshots"
snapshot_stale_hours = 2.0

[checks.journal]
what = "System journal"
every_min = 15
slack_min = 10
corrupt_keep_days = 7
# Signature mining. The two files sit beside the state file.
cluster_file = "journal-state.json"
signatures_file = "journal-signatures.json"
initial_since = "-24h"
max_entries = 300000
top_n = 50
max_clusters_per_ident = 400
max_clusters_per_group = 200
similarity = 0.5
retain_days = 30
# Known signatures (seeded from the 2026-10-11 audit). label: noise = ignore; known-issue = tracked backlog item.
# Patterns match at the START of the message: text mid-line is attacker-controllable and must never turn an alert
# into noise.
known = [
  { name = "summitflow-publication-guard-fixture", pattern = 'summitflow publication guard DEGRADED', label = "noise", note = "SummitFlow test fixtures logging mid-edit SyntaxError fallback" },
  { name = "pam-systemd-release-session", pattern = 'pam_systemd\(.*\): Failed to release session: Access denied', label = "noise", note = "Release-session denial for short-lived login sessions" },
  { name = "pam-lastlog-missing", pattern = 'PAM (unable to dlopen\(|adding faulty module: )\S*pam_lastlog\.so', label = "known-issue", note = "pam_lastlog referenced but absent (backlog)" },
  { name = "ibus-dup-bus", pattern = '(\S+: )?Two services allocated for the same bus name org\.freedesktop\.IBus|Failed to put bus name to hashmap', label = "known-issue", note = "IBus duplicate session bus (backlog)" },
  { name = "gnome-background-home", pattern = "Failed to load background 'file:///home/", label = "noise", note = "GNOME background URI points at home dir" },
  { name = "gnome-shell-stack", pattern = '^\s*(\S+@(resource|file):///|Stack trace:|### Promise created here)', label = "noise", note = "GJS stack trace continuation lines" },
  { name = "electron-int3", pattern = 'traps: .{1,40}?\[\d+\] trap int3', label = "known-issue", note = "Electron int3 crashes (backlog)" },
  { name = "failed-transient-unit", pattern = '^run-u\d+\.service: ', label = "noise", note = "Other agents' transient test units" },
  { name = "secret-service-dup", pattern = 'asked to register item /org/freedesktop/secrets/', label = "noise", note = "gnome-keyring duplicate item registration" },
]

[checks.gates]
what = "Public login gates"
every_min = 60
slack_min = 20
# The router's resolver: asking it (not this host, not a public DNS service) gives the address the internet sees.
dns_server = "192.168.86.1"
apps = [{ app = "Aico", host = "aico.summitflow.dev", path = "/api/auth/session" }]

[checks.ominull-lock]
what = "OmniNull lock"
every_min = 15
slack_min = 10
ceiling_file = "/etc/ominull/capability.ceiling"
authority_file = "/etc/ominull/host_authority.json"
allow_file = "/etc/ominull/host_auto_allow.json"
expected_ceiling = "engagement"

[checks.router-drift]
what = "Router drift"
every_min = 360
slack_min = 60
addr = "192.168.86.1"
key = "/etc/host-steward/router-status.key"
known_hosts = "/etc/host-steward/router-known_hosts"
connect_timeout = 10
timeout = 30
hold_hours = 24.0
denied_retry_hours = 6
keys = ["firmware", "keys", "dropbear", "forwards", "upnp", "services", "parental"]
# State a held change makes: failed for SSH keys and server settings, ok (noted) for firmware.
severity = { firmware = "ok", keys = "failed", dropbear = "failed", forwards = "warn", upnp = "warn", services = "warn", parental = "warn" }
labels = { firmware = "firmware", keys = "SSH login keys", dropbear = "SSH server settings", forwards = "port forwards", upnp = "UPnP settings", services = "enabled services", parental = "parental-control setup" }

# The push path (ns-36 detection; nothing is sent from here, the Proxmox sender does that). Each path is judged on
# its own; Aico's is not judged until one of its units exists. stale_min: how long a heartbeat may be quiet.
# confirm_min: how long a unit problem must hold before the row fails.
[checks.floor]
what = "Push path"
every_min = 15
slack_min = 10
owner_uid = 1000
stale_min = 30
confirm_min = 10
uptime_file = "/proc/uptime"

[[checks.floor.paths]]
name = "Aico"
user_units = ["aico-web.service"]
optional_user_units = ["aico-jobs.service"]
system_units = []
skip_when_absent = true

[[checks.floor.paths]]
name = "Sessions"
user_units = ["tether@default.service"]
system_units = []
down_signal = "sessions.down"
skip_when_absent = true

[checks.probes]
what = "Workstation probes"
every_min = 15
slack_min = 10
modules_root = "/lib/modules"
# st browser appends one line per fall back from the browser VM to local Chrome (empty: off).
fallbacks_file = "/home/kasadis/.local/state/st-browser/local-fallbacks.jsonl"
# The PVE guest name of the browser VM: fallbacks while it was stopped on purpose are a note.
browser_vm = "st-browser"
# The PVE guests check saves its guest task history here (beside the state file); without it every fallback counts.
guests_file = "pve-guests.json"
warn_rss_gib = 3.0
warn_fallbacks_24h = 10

# Usage evidence (ns-27): the check takes the /proc sample each pass and watches the nightly collection; the
# collect-usage job (timer at 04:40, see systemd/) does the full collection. The file starts fresh; nothing is pruned.
[checks.usage]
what = "Usage evidence"
every_min = 15
slack_min = 10
db = "/var/lib/host-steward/usage.sqlite3"
stale_hours = 36
# Users whose systemd user manager is snapshotted (empty: the site owner).
user_managers = []
pacct_files = ["/var/log/account/pacct.0", "/var/log/account/pacct"]
lastcomm_timeout = 600
job_what = "Usage evidence collection"
job_every_min = 1440
job_slack_min = 120

# Jobs that change the host (M5a-2, ns-28). Each is a dry run until its [acting] switch is true. Settings and lists
# live here; the code only knows the order of the steps.
[jobs.housekeeping]
what = "Daily housekeeping"
every_min = 1440
slack_min = 180
journal_vacuum = "4G"
spotify_cache = "/home/{owner}/snap/spotify/common/.cache"
spotify_pattern = '(^|/)spotify( |$)'
spotify_min_gib = 4
guestfs_dir = "/var/tmp/.guestfs-0"
guestfs_pattern = 'guestfs|libguestfs|qemu.*appliance'
guestfs_stale_days = 7
# Old versions beyond the newest keep_versions (and anything linked or running) in the families marked prune.
keep_versions = 2
versioned = [
  { name = "Playwright browsers", root = "~/.cache/ms-playwright", group = "stem", order = "version", prune = true },
]
# Existing SF cache caps, moved as data. pnpm previously pruned daily without a cap;
# zero preserves that policy for any nonempty store. No project/model/scratch retention.
cache_timeout_s = 600
package_caches = [
  { name = "uv", path = "/home/{owner}/.cache/uv", max_gib = 8, query = ["uv", "cache", "dir"], clean = ["uv", "cache", "prune"] },
  { name = "pnpm", path = "/srv/workspaces/.pnpm-store/v11", max_gib = 0, query = ["pnpm", "store", "path"], clean = ["pnpm", "store", "prune"] },
  { name = "npm", path = "/home/{owner}/.npm/_cacache", max_gib = 2, query = ["npm", "config", "get", "cache"], suffix = "_cacache", clean = ["npm", "cache", "clean", "--force"] },
  { name = "go", path = "/home/{owner}/.cache/go-build", max_gib = 4, query = ["go", "env", "GOCACHE"], clean = ["go", "clean", "-cache"] },
]

# Old top-level entries of the scratch disk (replaceable by definition) nothing has touched or holds open.
# keep: names or fnmatch patterns it never touches: files other tools read by path, and runs that may be evidence.
scratch_root = "/srv/scratch"
scratch_older_days = 21
scratch_max_per_run = 40
scratch_holds = ".scratch-holds"
# A sweep frees nothing while a scratch snapshot still holds the entry: its space comes back when they age out.
scratch_snapshots = "/srv/workspaces/.snapshots/scratch/projects/scratch"
# Home folders whose cache links point into scratch; a link left dangling gets its folder back, empty.
scratch_link_folders = [".", ".cache", ".cargo", ".cache/huggingface", ".local/share/pnpm", "go/pkg"]
scratch_keep = ["models", "cache", "tmp", "briefs", "latest", "restic*", "st-*", "passive*", "traffic*", "*redteam*", ".*"]
# Untagged image layers no container uses, older than a week. Tagged images stay.
image_prune = [
  { name = "podman", as_owner = true, argv = ["podman", "image", "prune", "--force", "--filter", "until=168h"] },
  { name = "docker", as_owner = false, argv = ["docker", "image", "prune", "--force", "--filter", "until=168h"] },
]

[jobs.space-guard]
what = "Disk space guard"
every_min = 15
slack_min = 10
# The disks it guards (the storage check's balance disks); label names the ballast mount point.
disks = [{ name = "System disk", path = "/", label = "root" }]
ballast_gib = 6
# The subvolume keeps its original name: it already holds the ballast file.
ballast_subvol = "@nightshift-ballast"
ballast_file = "ballast"
top_mounts = "/run/host-steward-ballast"
ballast_recheck_h = 24
# Before everything else on the ladder: scratch's own snapshots only hold replaceable data. (Their routine
# already drops them at the warning line, reserve + warn_margin; this is for a disk that fills between its runs.)
reclaim_first = [
  { cmd = ["aico", "backups", "run", "snapshots", "--pressure", "--scratch-only"], paths = ["/"] },
]
# Reclaim commands, run in order as the owner while a disk is under the line. {path} is the disk,
# {target_gib} the free space to restore; a {cmd, paths} entry only applies to those disks. Work
# snapshots live under /srv/workspaces on the system disk: thin them to the newest few, as SF did.
reclaim_commands = [
  { cmd = ["aico", "backups", "run", "snapshots", "--pressure"], paths = ["/"] },
]
reclaim_timeout_s = 900
# The journal tier runs only on the disk that holds this path.
journal_path = "/var/log"
journal_vacuum = "1G"
# Bounded balances: each pass relocates at most balance_limit data chunks. Near full means unallocated or free
# space below these, where the released ballast buys exactly one pass.
balance_percents = [0, 25, 50, 75, 85]
balance_limit = 16
balance_timeout_s = 600
near_full_unallocated_gib = 1
near_full_free_gib = 15
# Where the space goes: direct children of these roots, measured daily (every grow_pressure_h under the warning line).
grow_roots = [
  "/tmp", "/var/tmp", "/home/{owner}", "/var/lib", "/var/lib/docker", "/var/log", "/var/cache",
  "/srv/models", "/srv/scratch", "/srv/workspaces/projects",
]
grow_full_h = 24
grow_pressure_h = 2
grow_top = 12

# Last scrub and self-test results, read-only. The scrub and nvme-test jobs act per [acting] scrub / nvme_tests.
[checks.disk-tests]
what = "Scrubs and disk self-tests"
every_min = 360
slack_min = 60
nvme_device = "/dev/nvme0"
scrubs = [
  { name = "System disk", mount = "/" },
  { name = "Backup disk", mount = "/mnt/summitflow-native" },
]
# host-steward's timers per [acting] switch: once on, these must be enabled (install-root.sh enables them) or the row warns.
timers.scrub = ["host-steward-scrub-native.timer", "host-steward-scrub-root.timer"]
timers.nvme_tests = ["host-steward-nvme-short-test.timer", "host-steward-nvme-long-test.timer"]

[jobs.scrub]
# One lock file for both scrub targets, so two never run at once.
lock = "/run/lock/host-steward-btrfs-scrub.lock"
btrfs = "/usr/bin/btrfs"
args = ["scrub", "start", "-Bd", "-c", "3"]
[jobs.scrub.targets.native]
what = "Backup disk scrub"
mount = "/mnt/summitflow-native"
# The native scrub runs inside SummitFlow's backup window.
wrap = ["/usr/local/sbin/summitflow-backup-window", "run", "native", "--"]
timeout_s = 28800
every_min = 44640
slack_min = 2880
[jobs.scrub.targets.root]
what = "System disk scrub"
mount = "/"
wrap = []
timeout_s = 21600
every_min = 44640
slack_min = 2880

[jobs.nvme-test]
smartctl = "/usr/sbin/smartctl"
device = "/dev/nvme0"
[jobs.nvme-test.kinds.short]
what = "NVMe short self-test"
every_min = 10080
slack_min = 1440
[jobs.nvme-test.kinds.long]
what = "NVMe long self-test"
every_min = 43200
slack_min = 2880

# --- memory (F3: memctl, the memory check) ---------------------------------------------------------------------

# memctl: the memory controller (a user service, `host-steward memctl`). Sizes are GiB, PSI and swap percent.
# Green/amber/red with hysteresis (leaving a worse state needs the better state's margin); see memstate.py.
[memctl]
tick_s = 10
expires_s = 30
row_every_s = 300
offload_min_gib = 8
amber_avail_gib = 8
green_avail_gib = 10
red_avail_gib = 3
amber_from_red_avail_gib = 5
amber_psi = 5.0
green_psi = 3.0
red_psi = 20.0
amber_from_red_psi = 18.0
amber_swap = 75.0
green_swap = 60.0
# Swap use alone is parked pages, not pressure: it counts only while available memory is below this and PSI shows stalls.
swap_matters_avail_gib = 12
swap_matters_psi = 2.0
green_swap_matters_psi = 1.0
# Memory PSI alone can spike during rebuild bursts with plenty free: it makes red only below this much available.
psi_red_matters_avail_gib = 6
outside_hog_min_gib = 1
note_gap_s = 1800
outside_hog_after_s = 120
guard_fresh_s = 30
cmdline_head = 200
cache_cmd_min_mib = 256
recent_s = 120
counter_grace_s = 30
stop_match_s = 60
result_grace_s = 30
result_give_up_s = 300
tether_refresh_s = 60
disk_lines_refresh_s = 60
admission_margin_gib = 2
agent_comms = ["claude", "codex"]
agent_bins = ["claude", "codex", "codex-real"]

# {runtime} is the owner's runtime dir ($XDG_RUNTIME_DIR), {home} the owner's home. live_* are the files Tether and
# SummitFlow read; dry_* are written under host-steward/dry/ while [acting] memctl is false. shared_dir gets a second
# copy of the verdict and the records, live only (tmpfiles creates it). ballast_state is the space guard's file (the
# ballast it holds counts as free for amber); state_file carries the pve check's offload note.
[memctl.paths]
live_admission = "{runtime}/host-steward/admission.json"
live_heartbeat = "{runtime}/host-steward/memctl.json"
live_events = "{home}/.local/state/host-steward/memory-events.jsonl"
dry_admission = "{runtime}/host-steward/dry/admission.json"
dry_heartbeat = "{runtime}/host-steward/dry/memctl.json"
dry_events = "{home}/.local/state/host-steward/dry/memory-events.jsonl"
shared_dir = "/run/host-steward-memctl"
tether_state = "{home}/.local/state/tether/default"
tether_runtime = "{runtime}/tether/default"
ballast_state = "/var/lib/host-steward/jobs/space-guard.json"
state_file = "/var/lib/host-steward/state.json"

[checks.memory]
what = "Memory"
every_min = 15
slack_min = 10
owner_uid = 1000
meminfo = "/proc/meminfo"
psi_memory = "/proc/pressure/memory"
cgroup_user = "/sys/fs/cgroup/user.slice/user-{uid}.slice/user@{uid}.service"
cgroup_system = "/sys/fs/cgroup/system.slice"
# Stalled share of wall time since the previous run (PSI total= counters): warn at either.
pressure_warn_full_pct = 2.0
pressure_warn_some_pct = 10.0
# The kill incidents: the last window_h hours; a kill, a unit stop and a Tether crash record within match_s are one
# loss; kill_loop_count kills in one pane within kill_loop_window_min is a loop; a fresh loss waits tether_grace_s
# for Tether's own crash record. Paths take {uid} and {home}. events is the live record: memctl writes it once it acts.
window_h = 24
match_s = 180
kill_loop_count = 3
kill_loop_window_min = 60
tether_grace_s = 300
heartbeat_stale_s = 60
events = "{home}/.local/state/host-steward/memory-events.jsonl"
guard = "/run/user/{uid}/tether/default/memory-guard.json"
recoveries = "{home}/.local/state/tether/default/recoveries.json"
# The memory controller whose heartbeat and admission file the row reads; name and unit fill the row
# ("<name>'s memory controller", the unit to restart).
[checks.memory.memctl]
name = "host-steward"
unit = "host-steward-memctl"
heartbeat = "/run/user/{uid}/host-steward/memctl.json"
admission = "/run/user/{uid}/host-steward/admission.json"

# ---- Auth tripwire, sudo, docker access, attribution and declarations 

# Shared by the tripwire and sudo checks. paths is a floor (more_paths only adds); {owner_home} is the site owner's home.
# State files sit beside state.json: tripwire/<host>.json and sudo-baseline.json (so the baselines carry
# over between installs). A change stays a problem for hold_hours.
[site.auth]
paths = [
  "/etc/sudoers", "/etc/sudoers.d/*", "/etc/ssh/sshd_config", "/etc/ssh/sshd_config.d/*", "/etc/pam.d/*",
  "/root/.ssh/authorized_keys", "/root/.ssh/authorized_keys2", "{owner_home}/.ssh/authorized_keys",
  "{owner_home}/.ssh/authorized_keys2",
]
more_paths = []
# PVE: root's authorized_keys is a symlink into /etc/pve/priv; the target is tracked as well.
pve_extra_paths = ["/etc/pve/priv/authorized_keys"]
sudoers_globs = ["/etc/sudoers", "/etc/sudoers.d/*"]
hold_hours = 24.0
tripwire_dir = "tripwire"
sudo_file = "sudo-baseline.json"

# Listeners that reviewed, deployed commits introduce. A tripwire change whose every listener is one of these (same
# role, address, port and process name, and where "unit" is given the same cgroup unit) is a note naming the ref.
# Address forms: [fe80::]%veth* = a link-local bind on any container veth, [fe80::]%docker-bridge and
# <address>%docker-bridge = on any Docker bridge. Add an entry in the same commit that adds the listener.
[[site.auth.expected_listeners]]
role = "workstation"
listen = "udp [fe80::]%veth*:3702"
processes = ["python3"]
unit = "user@1000.service/session.slice/gvfs-daemon.service"
ref = "GNOME gvfsd's wsdd (WS-Discovery) on each container veth's link-local address; veths rotate with containers"

[[site.auth.expected_listeners]]
role = "workstation"
listen = "udp [fe80::]%docker-bridge:3702"
processes = ["python3"]
unit = "user@1000.service/session.slice/gvfs-daemon.service"
ref = "GNOME gvfsd's wsdd on each Docker bridge's link-local address (docker0, br-<id>: one per docker network)"

[[site.auth.expected_listeners]]
role = "workstation"
listen = "udp <address>%docker-bridge:3702"
processes = ["python3"]
unit = "user@1000.service/session.slice/gvfs-daemon.service"
ref = "GNOME gvfsd's wsdd on each Docker bridge's own address (checked live: the address is on docker0 or a br-<id>)"

# Declarations (host_steward/declare.py): `host-steward declare` / `lab-use`. The fresh files sit in agent-hints, which
# install-root.sh makes writable by the owner; the first-seen file is the root reader's own. roles name the hosts a declaration may use instead of a host name.
[site.declarations]
file = "/var/lib/host-steward/agent-hints/declarations.json"
lab_use_file = "/var/lib/host-steward/agent-hints/lab-use.json"
first_seen_file = "/var/lib/host-steward/declare/first-seen.json"
owner_user = "kasadis"
max_hours = 24
since_max_h = 4
retain_h = 26
max_entries = 50
max_bytes = 65536

[site.declarations.roles]
workstation = "davion-sidarli"
pve = "davion-gem"
router = "gl-router"
ids = "ominull"

# Who made a change (host_steward/attribution.py). tools: process name -> label. own_projects: trusted-unit project ->
# label for our own services. The env names are what an Aico session exports.
[site.attribution]
env_widget = "AICO_WIDGET_ID"
env_project = "AICO_PROJECT_ID"
label_widget = "Agent in session {widget}"
label_outside = "{tool} session outside Aico"
tools = { claude = "Claude Code", codex = "Codex" }
own_projects = { host-steward = "Host steward" }

# The exact services that count as our automation: this install's own units, and SummitFlow-managed project
# services, plus host-steward's. A "name@.service" entry covers that template's
# instances. Adding one is a loosening.
[site.trusted_units.system]
"summitflow-host-monitor.service" = "summitflow"
"host-steward-check.service" = "host-steward"
"host-steward-collect-usage.service" = "host-steward"
"host-steward-space-guard.service" = "host-steward"
"host-steward-housekeeping.service" = "host-steward"
"host-steward-nvme-long-test.service" = "host-steward"
"host-steward-nvme-short-test.service" = "host-steward"
"host-steward-scrub-native.service" = "host-steward"
"host-steward-scrub-root.service" = "host-steward"
"aico-split-dns.service" = "host-steward"
"host-steward-zswap.service" = "host-steward"
"host-steward-input-watch.service" = "host-steward"
"host-steward-home-off.service" = "host-steward"
"host-steward-fcm-token.service" = "host-steward"

[site.trusted_units.user]
# Aico's backups: `aico backups run TARGET` runs each as aico-backup-TARGET (packages/ops/src/backups.ts) and they
# call the root backup helpers through sudo -n on their schedule (the guard every 5 minutes).
"aico-jobs.service" = "aico"
"aico-backup-guard.service" = "aico"
"aico-backup-native.service" = "aico"
"aico-backup-native-pressure.service" = "aico"
"aico-backup-drive.service" = "aico"
"aico-backup-append.service" = "aico"
"aico-backup-snapshots.service" = "aico"
"aico-backup-verify.service" = "aico"
"host-steward-memctl.service" = "host-steward"
"host-steward-display-guard.service" = "host-steward"
"agent-browser-idle-reaper.service" = "browser-automation"
"aico-web.service" = "aico"
"browser-automation-web.service" = "browser-automation"
"codex-session-close-inactive.service" = "summitflow"
"codex-session-sync.service" = "summitflow"
"jobinator-4000-backend.service" = "jobinator-4000"
"jobinator-4000-frontend.service" = "jobinator-4000"
"jobinator-4000-hatchet-worker.service" = "jobinator-4000"
"portfolio-backend.service" = "portfolio-ai"
"portfolio-frontend.service" = "portfolio-ai"
"portfolio-hatchet-worker.service" = "portfolio-ai"
"summitflow-backend.service" = "summitflow"
"summitflow-frontend.service" = "summitflow"
"summitflow-hatchet-worker.service" = "summitflow"
"summitflow-infra-reconcile.service" = "summitflow"
"tether@default.service" = "aico"
"sf-rebuild-aico.service" = "aico"
"sf-rebuild-browser-automation.service" = "browser-automation"
"sf-rebuild-code-intelligence.service" = "code-intelligence"
"sf-rebuild-jobinator-4000.service" = "jobinator-4000"
"sf-rebuild-ominull.service" = "ominull"
"sf-rebuild-portfolio-ai.service" = "portfolio-ai"
"sf-rebuild-summitflow.service" = "summitflow"

[checks.tripwire]
what = "Login and listener changes"
every_min = 15
slack_min = 10
# Host names as the declarations and baselines know them, and the words the rows use for them.
hosts = { workstation = "davion-sidarli", pve = "davion-gem" }
labels = { workstation = "the workstation", pve = "the PVE host" }
dpkg_log = "/var/log/dpkg.log"
cloudflared_config = "/etc/cloudflared/config.yml"
# A daemon that comes back within this long after a boot is boot noise.
boot_window_min = 45
# Most explained-change notes one row carries.
notes_max = 3

[checks.sudo]
what = "Sudo use"
every_min = 15
slack_min = 10
host = "davion-sidarli"
notes_max = 3
initial_since = "-14d"
# The sudo binaries whose journal lines count (the journal's _EXE of the line). This host runs sudo-rs; a filter on
# /usr/bin/sudo alone saw no calls at all.
sudo_exes = ["/usr/bin/sudo", "/usr/bin/sudo.ws", "/usr/lib/cargo/bin/sudo"]
# Baseline: the 24h total is judged against the median of earlier 24h windows once learn_days are stored (seed until then).
learn_days = 3
seed_daily_total = 620
spike_factor = 2.0
spike_min_extra = 1000
family_spike_factor = 3.0
family_spike_min = 150
# Families that never count as new or spiking (host tools whose volume follows their timers). Globs.
known_families = [
  "host-steward check", "host-steward check *", "host-steward collect-usage",
]
# A family every call of which came from one of our agent sessions (agents have routine root) is a note when new or
# spiking, not a warning. Calls from anyone else, or with no traced caller, still warn.
agent_runs_are_notes = true
# Extra exact caller unit names that are scheduled automation (the site's trusted units always count).
automation_units = []
# Commands that touch these are sensitive (a write is a problem unless an agent or a declaration explains it).
sensitive = '''/etc/sudoers|visudo|/etc/ssh/|sshd_config|/etc/pam\.d|authorized_keys|pam-auth-update'''
# Tools whose first non-option word is a subcommand (the family is "tool sub").
subcommand_tools = [
  "host-steward", "btrfs", "systemctl", "apt", "apt-get", "dpkg", "snap", "ufw", "ip", "docker",
  "pct", "qm", "zfs", "lvm", "journalctl", "loginctl", "machinectl", "nmcli", "update-alternatives", "flatpak", "git",
]
# The host's own root tools. reads: subcommands that only read. free_text: options whose values are prose (a note
# naming /etc/sudoers.d touches nothing).
[checks.sudo.own_tools."/usr/local/bin/host-steward"]
reads = ["check", "collect-usage", "declare", "lab-use"]
free_text = ["--note", "--reason"]

[checks.security]
what = "Docker access"
every_min = 15
slack_min = 10
group_file = "/etc/group"
socket = "/var/run/docker.sock"

# --- PVE guests, the asset registry and trends (F2: ns-01 leftovers, ns-23) -------------------------------------------

# Site values for the guest/asset checks. lan_bridges: PVE bridges that are the home LAN; lab_vlans: VLAN tags on them
# that count as off the LAN (tag 1 never does). lab_use_files: where agent sessions declare they use a parked machine
# (`host-steward declare`); the registry reads them as root.
[site.assets]
lan_bridges = ["vmbr0"]
lab_vlans = []
lab_use_files = ["/var/lib/host-steward/agent-hints/lab-use.json"]

# An isolated lab segment: its bridge must never be up without its nftables filter table, and no flow may pass between
# it and a private address unless `allow` names it (from/to address lists, proto, port; each optional). The list
# mirrors the accept rules of the PVE table inet lab_isolation.
[[site.segment_guards]]
bridge = "labnet"
nft_table = "inet lab_isolation"
allow = [
  # Aico's enrolled lab workers (VM 200 agent-work 10.20.0.114, VM 201 neri-hunters 10.20.0.115) to the full peers'
  # fleet link (CT 190 and the workstation), and CT 190 back to them.
  { from = ["10.20.0.114", "10.20.0.115"], to = ["192.168.86.59", "192.168.86.128"], proto = "tcp", port = 7449 },
  { from = ["192.168.86.59"], to = ["10.20.0.114", "10.20.0.115"], proto = "tcp", port = 7449 },
  # OmniNull agents to the hub.
  { to = ["192.168.86.58"], proto = "tcp", port = 9443 },
  # The workstation into the lab.
  { from = ["192.168.86.128"] },
]

[checks.guests]
what = "PVE guests"
every_min = 15
slack_min = 10
# The thin-pool storage whose VM disks should have discard on (so freed space returns to the pool).
pool_storage = "local-lvm"
guest_disk_warn_pct = 85.0
guest_disk_crit_pct = 95.0
# The guests and their start/stop history, saved beside the state file for the probes check.
guests_file = "pve-guests.json"

[checks.assets]
what = "Asset registry"
every_min = 15
slack_min = 10
# A parked machine running with no lab-use declaration and no automation start: a warning, and a failure once it has
# been that way this long (sooner when it holds data).
unexplained_hours = 12.0
unexplained_data_hours = 1.0

# Trends over the daily readings the pve, storage, ecc and guests checks record (/var/lib/host-steward/history.sqlite3).
# A spec's host is a site role; severity is the state of a worsening verdict; the tier step (assets.toml classes)
# raises data signals to failed on a host that holds data. Rule kinds are in trend.py.
[checks.trends]
what = "Trends"
every_min = 15
slack_min = 10
names = { pve = "PVE host", workstation = "Workstation" }

[[checks.trends.specs]]
code = "pve.ecc.trend"
host = "pve"
label = "memory"
severity = "failed"
digest_always = true
rules = [
  { metric = "mem.ce", kind = "rate", label = "corrected", factor = 2.0, floor = 10.0, hold_h = 72.0 },
  { metric = "mem.ce_overflow", kind = "rate", label = "Error_overflow", factor = 2.0, floor = 10.0 },
  { metric = "mem.ue", kind = "any", label = "uncorrected", hold_h = 72.0, push = false },
]

[[checks.trends.specs]]
code = "pve.smart.trend"
host = "pve"
label = "disks"
severity = "failed"
rules = [
  { metric = "disk.media_errors", kind = "counter", label = "media errors" },
  { metric = "disk.wear_pct", kind = "projection", label = "wear", limit = 100.0, horizon_days = 90.0, fmt = "{:.0f}%" },
  { metric = "disk.spare_used_pct", kind = "counter", label = "spare used", floor = 5.0, fmt = "{:.0f}%" },
]

[[checks.trends.specs]]
code = "storage.smart_trend"
host = "workstation"
label = "disks"
severity = "failed"
rules = [
  { metric = "disk.media_errors", kind = "counter", label = "media errors" },
  { metric = "disk.realloc", kind = "counter", label = "reallocated sectors" },
  { metric = "disk.pending", kind = "counter", label = "pending sectors" },
  { metric = "disk.wear_pct", kind = "projection", label = "wear", limit = 100.0, horizon_days = 90.0, fmt = "{:.0f}%" },
]

# limit = the pool's failed line (checks.pve thin_crit): a test keeps the two equal.
[[checks.trends.specs]]
code = "pve.thin.trend"
host = "pve"
label = "thin pool"
rules = [
  { metric = "pool.data_pct", kind = "projection", label = "data", limit = 92.0, horizon_days = 30.0, fmt = "{:.1f}%", reset_drop = 3.0, robust = true },
  { metric = "pool.meta_pct", kind = "projection", label = "metadata", limit = 92.0, horizon_days = 30.0, fmt = "{:.1f}%", reset_drop = 3.0, robust = true },
]

[[checks.trends.specs]]
code = "storage.disk_trend"
host = "workstation"
label = "disks"
rules = [
  { metric = "disk.used_pct", kind = "projection", label = "used", limit = 95.0, horizon_days = 21.0, critical_days = 3.0, fmt = "{:.0f}%", reset_drop = 3.0, robust = true },
]

# limit = checks.guests guest_disk_crit_pct.
[[checks.trends.specs]]
code = "pve.guest_disk_trend"
host = "pve"
label = "guest disks"
rules = [
  { metric = "guest.disk_used_pct", kind = "projection", label = "used", limit = 95.0, horizon_days = 21.0, critical_days = 3.0, fmt = "{:.0f}%", dim_name = "VM ", reset_drop = 3.0, robust = true },
]
