# What each finding means in plain words (the explain table). A problem entry is signal."code"; an ok signal
# worth reading in the row (note) is signal."code:ok". Optional keys: impact, next. {name} fills from the signal's
# fields; a missing field reads "?". The row shows the worst problem in full and the others in a short line.

# The line a row says when every signal is fine.
[ok]
guests = "Guests are running and no segment is open."
assets = "Every asset has a tier and no parked machine is running unexplained."
trends = "No slow trend is getting worse."
tripwire = "Login settings and listening ports match the last check."
sudo = "Sudo use looks normal."
security = "Nobody is in the docker group and its socket is locked down."
disk-tests = "Scrubs and self-tests found nothing wrong."
memory = "No memory stalls or kills, and memctl and Tether's guard are reporting."
floor = "The push path is up."
usage = "Usage evidence is being collected."
probes = "The next boot will find a GPU driver and no agent Chrome is eating memory."
workstation = "The workstation looks healthy."
storage = "Disks have room, Btrfs is healthy and SMART is clean."
perf = "No units are crash-looping and swap is calm."
pve = "The PVE host has room, no failed units and clean disks."
ecc = "No uncorrected memory errors on the PVE host."
thermal = "Everything is running cool."
backups = "Backups are fresh."
journal = "The system journal is readable."
gates = "Every public app asks for a login."
ominull-lock = "The OmniNull lock matches the site file."
router-drift = "The router's setup has not changed."

[signal."check.crashed"]
what = "The {check} check broke ({why}) before it could look"
impact = "Nothing was checked this round"
next = "Run host-steward check --only {check} and read the log"

[signal."check.empty"]
what = "The {check} check returned nothing"
next = "Run it once by hand and read the log"

[signal."check.probe"]
what = "One probe in this check ({probe}) broke: {why}"
next = "The other probes still ran; read the host-steward log"

# workstation
[signal."ws.units.failed"]
what = "{n} units have failed: {units}"
impact = "Whatever they run is not running"
next = "Look at the unit's log, then restart it"

[signal."ws.units.unreadable"]
what = "Could not list failed units ({why})"
next = "Try systemctl --failed by hand"

[signal."ws.reboot.required"]
what = "A package update wants a reboot"
next = "Reboot when the work in flight is done"

[signal."ws.apt.unreadable"]
what = "Could not read pending updates ({why})"

[signal."ws.apt.pending"]
what = "{security} security updates are waiting ({held} held back)"
impact = "Known holes stay open until they are installed"
next = "Install them and reboot if asked"

[signal."ws.apt.pending:ok"]
what = "{pending} package updates are waiting, none for security"

[signal."ws.swap.drift"]
what = "{n} swap or zswap settings are not what they should be ({keys})"
impact = "The machine may swap harder than planned"
next = "Re-apply the sysctl and zswap settings"

[signal."ws.ufw.active"]
what = "The firewall is not active ({why})"
impact = "Nothing filters inbound traffic"
next = "Run ufw enable"

[signal."ws.journald.retention"]
what = "Journal size or retention drifted ({keys})"
next = "Restore the journald drop-in"

[signal."ws.memory.pressure"]
what = "Memory pressure is high: {kind} stall at {pct}%"
impact = "Things will feel slow and something may be killed"
next = "See what is using memory"

[signal."ws.net.internet"]
what = "The internet is not reachable: {how}"
next = "Check the router and the uplink"

[signal."ws.tunnel.cloudflared"]
what = "The public tunnel is not ready ({status})"
impact = "Outside access to the apps is down"
next = "Restart cloudflared"

[signal."ws.infra.containers"]
what = "Core containers are down: {names}"
impact = "The services that need them are failing"
next = "Start the stack again"

[signal."ws.cert.expiry"]
what = "The certificate for {worst} expires in {days} days"
impact = "Browsers will refuse the site once it does"
next = "Renew it now"

# storage
[signal."storage.disk.missing"]
what = "{name} is not mounted"
next = "Plug it in or mount it"

[signal."storage.disk.space"]
what = "{name} has {free} GiB free ({pct}% used)"
impact = "Backups and builds stop when it runs out"
next = "Free some space"

[signal."storage.btrfs.missing"]
what = "The btrfs tool is missing, so {name} was not checked"

[signal."storage.alloc.unreadable"]
what = "Could not read how {name} is allocated"

[signal."storage.alloc"]
what = "{name} has only {unallocated} GiB unallocated"
impact = "Btrfs can fail writes even with free space showing"
next = "Run a balance"

[signal."storage.btrfs.errors"]
what = "{name} has Btrfs device errors ({errors})"
impact = "Data may be damaged"
next = "Run a scrub and check the drive"

[signal."storage.smart.missing"]
what = "SMART cannot be read here (smartctl is missing)"

[signal."storage.smart"]
what = "The drive {dev} reports trouble: {why}"
impact = "It may fail soon"
next = "Make sure its backups are fresh and plan a replacement"

# perf
[signal."perf.crash_loop"]
what = "{n} units keep restarting: {units}"
impact = "They burn CPU and never stay up"
next = "Read their logs and fix or stop them"

[signal."perf.crash_loop.unreadable"]
what = "Could not read restart history ({why})"

[signal."perf.swap"]
what = "Swap is {pct}% full while {avail} GiB of memory is free"
impact = "Things run slower than they need to"
next = "Check what pinned pages into swap"

[signal."perf.swap.unreadable"]
what = "Could not read memory use"

# pve
[signal."pve.unreachable"]
what = "The PVE host did not answer ({why})"
impact = "Its checks did not run"
next = "Check the cable, power and the hop key"

[signal."pve.thin.data"]
what = "The thin pool {pool} is {pct}% full"
impact = "Guests freeze when it reaches 100%"
next = "Free space or grow the pool"

[signal."pve.thin.metadata"]
what = "The thin pool {pool} metadata is {pct}% full"
impact = "Guests freeze when it fills"
next = "Grow the metadata"

[signal."pve.thin.unreadable"]
what = "Could not read the PVE thin pools"

[signal."pve.vg.free"]
what = "Volume group {vg} has only {gib} GiB free"
impact = "The pool cannot grow"
next = "Free space in the group"

[signal."pve.units.failed"]
what = "{n} units failed on the PVE host: {units}"
next = "Look at their logs"

[signal."pve.smart"]
what = "A PVE disk {dev} reports trouble: {why}"
impact = "It may fail soon"
next = "Check backups and plan a replacement"

[signal."pve.reboot.required"]
what = "The PVE host has waited {days} days for a reboot"
impact = "It runs an old kernel"
next = "Reboot it in a quiet window"

[signal."pve.reboot.required:ok"]
what = "The PVE host has waited {days} days for a reboot"

[signal."pve.rasdaemon"]
what = "rasdaemon is not running on the PVE host"
impact = "Memory errors are not recorded"
next = "Start it"

# ecc
[signal."ecc.uncorrected"]
what = "The PVE host logged {n} uncorrected memory errors"
impact = "Memory is failing and data can be corrupt"
next = "Run a memory test and replace the module"

[signal."ecc.new_region"]
what = "Corrected memory errors appeared in {n} new places"
impact = "A memory module may be starting to fail"
next = "Watch it and test the memory"

[signal."ecc.spike:ok"]
what = "Corrected memory errors spiked to {n} in a day (usual {base}); recorded only"

[signal."ecc.corrected:ok"]
what = "{n} corrected memory errors in a day; recorded only"

# thermal
[signal."thermal.hot"]
what = "{host} is hot: {sensors}"
impact = "It will slow down or shut off"
next = "Check fans and airflow"

[signal."thermal.unavailable"]
what = "{host} temperatures could not be read"

# backups
[signal."backups.owner"]
what = "The backup owner account {owner} does not exist here"

[signal."backups.file.missing"]
what = "The backup status file {file} is missing"
impact = "A backup job may have stopped"
next = "Run it or look at its timer"

[signal."backups.file.unreadable"]
what = "The backup status file {file} cannot be read"

[signal."backups.file.failed"]
what = "A backup job is failing: {file} ({what})"
impact = "There may be no fresh copy"
next = "Read its log and re-run it"

[signal."backups.file.stale"]
what = "The backup status {file} is {days} days old"
impact = "A scheduled run has not happened"
next = "Check its timer"

[signal."backups.sources.unreadable"]
what = "Could not read the backup freshness receipt"

[signal."backups.sources.stale"]
what = "The backup freshness receipt is {hours} h old"
impact = "Nothing is writing it, so freshness is unknown"
next = "Check the SummitFlow backup timer"

[signal."backups.capture.refused"]
what = "Backups are being refused for {hours} h ({sources})"
impact = "No new copies are being made"
next = "Free disk space, then re-run"

[signal."backups.sources.failing"]
what = "{n} backup sources are failing: {sources}"
impact = "Their data has no fresh copy"
next = "Read each source's log"

[signal."backups.native"]
what = "The host backup is not healthy: {why}"
impact = "Recovery points may be missing"
next = "Re-run the host capture"

[signal."backups.autosnap"]
what = "Project snapshots are not healthy: {why}"
next = "Check the autosnap timer"

[signal."backups.autosnap:ok"]
what = "{why}"

[signal."backups.pve"]
what = "The PVE backups are not healthy: {why}"
impact = "PVE data may lack a verified offsite copy"
next = "Check the PVE backup receipt"

# journal
[signal."journal.unreadable"]
what = "Could not read the journal ({why})"

[signal."journal.corrupt"]
what = "{n} journal files are corrupt; {old} for over {days} days"
impact = "Old logs are lost"
next = "Delete the broken files"

[signal."journal.corrupt:ok"]
what = "{n} journal files were skipped as corrupt, recently"

# gates
[signal."gates.app"]
what = "{app} may be open to the internet: {how}"
impact = "Anyone can reach it without logging in"
next = "Put the login gate back"

# ominull-lock
[signal."ominull.lock.differs"]
what = "The OmniNull lock is {ceiling}, but the site file wants {want}"
impact = "The agent has the wrong capability ceiling"
next = "Re-run the root install for this host"

[signal."ominull.lock:ok"]
what = "OmniNull lock {ceiling}; {scripts}"

# router-drift
[signal."router.drift"]
what = "The router's {what} changed ({n} times)"
impact = "Someone or something changed the router"
next = "Open the router and check it was you"

[signal."router.drift:ok"]
what = "The router's {what} changed; recorded"

[signal."router.parental.off"]
what = "Parental controls are not enabled on the router"

[signal."router.bad_output"]
what = "The router answered with something unreadable"

[signal."router.unreachable"]
what = "The router has not answered for {minutes} minutes"
next = "Check the router and the SSH key"

[signal."router.source_rejected"]
what = "The router {how}"
next = "Allow this address in the status script"

[signal."router.host_key_changed"]
what = "The router {how}"
impact = "Its SSH identity changed, usually after a firmware upgrade"
next = "Confirm the upgrade, then re-pin the key"

[signal."router.key_missing"]
what = "The router {how}"
next = "Re-install the status key"

[signal."router.script_missing"]
what = "The router {how}"
next = "Re-install the status script"

# probes
[signal."probes.nvidia.missing"]
what = "Next boot would have no GPU driver: kernel {kernels} has no NVIDIA {branch} module"
impact = "The graphics driver would not load after a reboot"
next = "Install {package} before rebooting"

[signal."probes.nvidia.fallback:ok"]
what = "An old fallback kernel ({kernels}) has no NVIDIA {branch} module; it is not the default or running kernel"

[signal."probes.browser"]
what = "{count} agent-driven local Chrome ({gib} GiB); {recent} fallbacks from the browser VM to local Chrome in 24h{off}"
impact = "Agent browsers belong on the browser VM; local ones eat workstation memory"
next = "Check why the browser VM is not answering and close stray local Chrome"

[signal."probes.browser:ok"]
what = "{count} agent-driven local Chrome ({gib} GiB); {recent} fallbacks to local Chrome in 24h{off}"

# journal signatures
[signal."journal.signatures:ok"]
what = "{new} new unlabeled journal signatures in 24h ({tracked} tracked)"

[signal."journal.signatures.unreadable"]
what = "Could not read the journal's warnings"
next = "Run journalctl -p warning by hand and read the error"

[signal."journal.signatures.unwritable"]
what = "Could not save the journal signatures ({why})"
next = "Check the free space and permissions in the host-steward state folder"

[signal."floor.down"]
what = "The {path} push path is down: {why}"
impact = "Alerts to the owner's phone may not leave this host"
next = "Restart the named units; check the journal for why they stopped"

[signal."floor.watching:ok"]
what = "The {path} push path is being watched: {why}"

[signal."floor.none"]
what = "No push path is installed to judge"
next = "Install Aico's web server, or check the [[checks.floor.paths]] list"

[signal."usage.collect_stale"]
what = "Usage evidence was last collected {how}"
impact = "The 30-day list of what ran is going out of date"
next = "Check host-steward-collect-usage.timer and run host-steward collect-usage"

[signal."usage.sample_failed"]
what = "The usage sample could not be saved ({why})"
next = "Check free space and the usage file's folder"

[signal."usage.collected:ok"]
what = "Collected {records} usage records from {sources} sources"

[signal."usage.acct_unavailable"]
what = "Collected {records} usage records from {sources} sources, but process accounting (acct, lastcomm) could not be read"
impact = "Programs that run only briefly are missing from the evidence"
next = "Install the acct package or check /var/log/account"

[signal."usage.collect_failed"]
what = "The usage collection broke ({why})"
next = "Run host-steward collect-usage and read the log"

# --- memory ---

[signal."memory.stall"]
what = "Memory stalled tasks for {full}% of the last {min} minutes (some tasks {some}%); {avail} GiB available. Most stalled: {top}"
impact = "Sessions and builds slow down while this lasts"
next = "memctl and the kernel act on their own; look at what is using the memory if it keeps up"

[signal."memory.stall:ok"]
what = "Memory stalls {full}% over the last {min} minutes; {avail} GiB available"

[signal."memory.kills"]
what = "{n} memory kill{plural} in the last {hours} hours: {list}"
impact = "A session or its work was lost or cut short"
next = "Resume the session if it was not resumed, and see what held the memory"

[signal."memory.kills:ok"]
what = "{n} memory kill{plural} in the last {hours} hours: {list}"

[signal."memory.kills.unread:ok"]
what = "Not read for the kill count: {unread}"

[signal."memory.memctl_alive"]
what = "The memory controller {ago}"
impact = "Heavy-work admission and the kernel kill records are stale"
next = "Restart it: systemctl --user restart host-steward-memctl"

[signal."memory.guard_alive"]
what = "{who} {ago}"
impact = "Nothing stops a runaway agent job before the kernel does"
next = "Restart it: systemctl --user restart tether@default"

[signal."disk_tests.scrub"]
what = "The last scrub of {name} is {status} ({started}) with: {errors}"
impact = "A scrub reads every block and checks it; errors mean some data did not match its checksum"
next = "Run btrfs scrub status on that disk and look at the device errors in the storage row"

[signal."disk_tests.scrub.unreadable"]
what = "The scrub result of {name} ({mount}) could not be read"
next = "Check the disk is mounted and run btrfs scrub status {mount}"

[signal."disk_tests.selftest"]
what = "The latest NVMe self-test on {device} did not pass: {kind}, {status}, {when}"
impact = "The drive reported a problem with itself"
next = "Read smartctl -a {device} and plan a replacement or a backup check"

[signal."disk_tests.selftest.unreadable"]
what = "The NVMe self-test log of {device} could not be read"
next = "Run smartctl -l selftest {device} by hand"

[signal."disk_tests.selftest.none"]
what = "No NVMe self-test has been recorded on {device} yet"

[signal."disk_tests.last:ok"]
what = "Last: {text}"

[signal."disk_tests.dry_run:ok"]
what = "Nightshift still runs the scrubs and self-tests until cutover"

# tripwire, sudo, security
[signal."tripwire.changed"]
what = "{host}: {msg}"
impact = "Nothing explains it"
next = "Check it, then run: host-steward security-ack --event {id} --note WHY"

[signal."tripwire.recorded:ok"]
what = "{host}: {msg}"

[signal."tripwire.declared:ok"]
what = "{host}: {msg}. {said}"

[signal."tripwire.unavailable"]
what = "Could not check login settings and ports on {host} ({why})"
next = "Check the host-steward state folder and run host-steward check --only tripwire"

[signal."tripwire.unreachable"]
what = "Could not reach {host} to check its login settings and ports ({why})"
next = "Check that the PVE host answers over ssh"

[signal."sudo.unreadable"]
what = "Could not read sudo use ({why})"
next = "Run journalctl -t sudo by hand and read the error"

[signal."sudo.spike"]
what = "{total} sudo calls in 24 hours, against about {median} a day"
next = "See what is calling sudo with host-steward check --only sudo --dry-run"

[signal."sudo.new_family"]
what = "{n} new kinds of sudo command in 24 hours: {families}"

[signal."sudo.new_family.auto:ok"]
what = "{n} new kinds of sudo command, all from known services: {by}"

[signal."sudo.family_spike"]
what = "Sudo command spikes: {spikes}"

[signal."sudo.family_spike.auto:ok"]
what = "Sudo command spikes, all from known services: {by}"

[signal."sudo.failure"]
what = "A sudo login failed for {user}: {detail} ({when})"
next = "If it was you, run: host-steward security-ack --event {id} --note WHY"

[signal."sudo.sensitive"]
what = "sudo touched {targets}: {families} ({user}, {hour}, {n} commands)"
impact = "Nothing explains it, and a bad edit can lock the owner out"
next = "Check it, then run: host-steward security-ack --event {id} --note WHY"

[signal."sudo.declared:ok"]
what = "sudo touched {targets} ({hour}). {said}"

[signal."sudo.recorded:ok"]
what = "{msg}"

[signal."security.docker"]
what = "Docker access is open: {problems}"
impact = "Anyone in the docker group has root"
next = "Take them out of the group and put the socket back to root:docker 0660"

[signal."security.docker.unreadable"]
what = "Could not check Docker access ({why})"

# --- PVE guests, the asset registry, storage fill rate, trends (F2) ---
[signal."guests.unreachable"]
what = "Could not read the PVE guests ({why})"
impact = "Guest state, disks and segment guards are not being checked"
next = "Check that the PVE host answers over SSH"

[signal."guests.none"]
what = "PVE lists no guests"
impact = "Either the read failed or every guest is gone"
next = "Look at the PVE host"

[signal."guests.stopped"]
what = "{n} guests that should start at boot are down: {names}{held}"
impact = "Whatever runs in them is not running"
next = "Start them, or stop them on purpose in Proxmox"

[signal."guests.stopped:ok"]
what = "Stopped on purpose: {held}"

[signal."guests.discard_off"]
what = "{n} thin-pool VM disks have discard off ({where}){pending}"
impact = "Data deleted inside the guest never returns to the pool, so the pool fills faster"
next = "Turn discard on for those disks"

[signal."guests.agent_down"]
what = "The guest agent does not answer on {n} VMs ({vmids})"
impact = "Disk use inside them cannot be read"
next = "Start the agent in the guest"

[signal."guests.disk"]
what = "{name} ({vmid}) {mount} is {pct}% full ({free} GiB free)"
impact = "The guest stops working when its disk fills"
next = "Free space inside the guest or grow its disk"

[signal."guests.segment"]
what = "The lab segment {bridge} is up without its filter table {table}"
impact = "Lab machines can reach the home network"
next = "Load the isolation rules on the PVE host, or take the bridge down"

[signal."guests.segment:ok"]
what = "Lab segment {bridge}: {how} (filter table {table})"

[signal."assets.config"]
what = "{n} entries in the asset list were refused (first: {first})"
impact = "Those machines are not rated"
next = "Fix the entry in assets.toml"

[signal."assets.pve_meta_unavailable:ok"]
what = "PVE could not be read, so the registry was not compared with it ({why})"

[signal."assets.parked_in_use:ok"]
what = "{asset} is parked and running{held}: {by} says {reason} (until {until})"

[signal."assets.parked_token:ok"]
what = "{asset} is parked and was started by automation ({user}) at {at}"

[signal."assets.parked_running"]
what = "{asset} is parked but running{held}: {how}"
impact = "A machine that should be off is on"
next = "Stop it, or say you are using it with host-steward declare --what vm"

[signal."assets.suggestion:ok"]
what = "{n} PVE tier marks differ from the asset list (first: {first})"

[signal."assets.tier_lowered:ok"]
what = "{n} machines have a lower tier than last time (first: {first})"

[signal."assets.discovered:ok"]
what = "{n} PVE guests are not in the asset list and were tiered at first sight: {names}"

[signal."assets.lab_on_lan"]
what = "{asset} is a lab machine running with {nics} on the LAN bridge ({why})"
impact = "A lab machine can reach the home network"
next = "Move its network card to the lab bridge, or stop it"

[signal."assets.lab_not_isolated"]
what = "{asset} is a lab machine but is not verified isolated: {why}"
impact = "Its tier assumes it cannot reach the LAN"
next = "Check its network cards and the PVE firewall"

[signal."storage.fill"]
what = "{name} is filling {rate} GiB/h and reaches the backup reserve in about {hours} h{held}"
impact = "Backups stop at the reserve"
next = "Find what is growing and free it"

[signal."storage.ballast:ok"]
what = "{name} holds {gib} GiB of emergency ballast"

[signal."storage.reclaim.exhausted"]
what = "{name}: the space guard ran every reclaim step ({tiers}) and only {free} GiB is free, under the {reserve} GiB reserve{held}"
impact = "Nothing automatic is left to free space"
next = "Free space by hand; the largest growers are listed"

[signal."storage.reclaim.ran:ok"]
what = "{name}: the space guard's reclaim ({tiers}) took free space from {before} to {after} GiB"

[signal."pve.thin.trend"]
what = "{line}"
impact = "Guests freeze if the pool fills"
next = "Free space (discard, snapshot pruning) or grow the pool before then"

[signal."pve.smart.trend"]
what = "{line}"
impact = "A PVE disk is wearing or failing"
next = "Check backups and plan a replacement"

[signal."storage.smart_trend"]
what = "{line}"
impact = "A workstation disk is wearing or failing"
next = "Check backups and plan a replacement"

[signal."storage.disk_trend"]
what = "{line}"
impact = "Backups and builds stop when it fills"
next = "Find what is growing and free it"

[signal."pve.guest_disk_trend"]
what = "{line}"
impact = "A guest stops working when its disk fills"
next = "Free space in the guest or grow its disk"

[signal."pve.ecc.trend"]
what = "{line}"

[signal."trends.seeded:ok"]
what = "Copied {n} daily readings from Nightshift's history"

[signal."trends.none"]
what = "No readings recorded yet"
