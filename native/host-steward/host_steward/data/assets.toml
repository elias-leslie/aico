# The asset registry: one entry per host, router, guest or endpoint the checks rate. This file is where the owner changes a tier.
#
# tier: critical | standard | lab. kind: host | router | vm | ct | template | endpoint. presence: always_on |
# intermittent | parked. data: holds data or secrets. isolated: declared isolated (counts only with PVE NIC evidence).
# role: which host checks apply (workstation | pve | router). hosts: names a host check reports under.
# names: PVE guest names, lowercase. backup_targets: backup receipt source ids covering its data.
# Guests PVE has that are not listed here are discovered by the assets check and tiered at first sight.

# What kind of signal each check family raises, for the tier step (assets.tier_state). First match wins.
# security: never lowered, raised on a critical asset. data: failed on an asset that holds data. health: lab assets
# only note it. Anything unmatched is health.
[tiers]
classes = [
  ["*.crashed", "health"], ["*.unavailable", "health"], ["*.history", "health"],
  ["tripwire.state", "health"], ["tripwire.*", "security"], ["security.*", "security"], ["canary.*", "security"],
  ["weak.*", "security"], ["backups.*", "data"], ["pve.backup.*", "data"], ["*.smart*", "data"],
  ["pve.ecc.*", "data"], ["ecc.*", "data"], ["pve.thin.*", "data"],
]
# Tags and pools PVE can put on a guest to suggest a tier (honoured only when present the first time it is seen).
tag_tiers = { "tier-critical" = "critical", "tier-standard" = "standard", "tier-lab" = "lab", "lab" = "lab" }

[[assets]]
id = "davion-gem"
tier = "critical"
kind = "host"
role = "pve"
hosts = ["davion-gem"]
names = ["davion-gem"]
backup_targets = ["pve-cluster-config", "pve-host-files"]
data = true
at_rest = false
note = "Proxmox VE host; /vault on its plain root fs"

