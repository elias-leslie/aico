# Aico LAN split-horizon DNS for this workstation (loopback only).
#
# Scope: ONLY hosts that have no public DNS record / no Cloudflare tunnel
# ingress. Everything else under summitflow.dev forwards upstream and resolves
# to Cloudflare, so it keeps its Cloudflare Access auth on the LAN too.
#
# `local=` makes these names authoritative here, so HTTPS/SVCB queries return
# NODATA. Without that, Chrome learns Cloudflare ECH records, sends
# cloudflare-ech.com SNI to the local Caddy, and TLS fails.
listen-address=127.0.0.1
bind-interfaces
no-resolv

# Upstream: Google Nest Wifi router, then public fallback.
server=192.168.86.1
server=1.1.1.1
server=1.0.0.1

# Hosts served by this desktop's loopback-only Caddy. Map a host here only after it
# works on the local path; never approve.summitflow.dev.
local=/a-loom.summitflow.dev/
local=/a-loom-api.summitflow.dev/
address=/a-loom.summitflow.dev/127.0.0.1
address=/a-loom-api.summitflow.dev/127.0.0.1
local=/aico.summitflow.dev/
address=/aico.summitflow.dev/127.0.0.1
