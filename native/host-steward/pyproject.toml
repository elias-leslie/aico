# Not a package: the check environment for Tether's operator scripts
# (stdlib only, plus PyYAML for the GitHub delivery workflow check) and their tests. `uv sync --locked --directory native/host-steward`
# makes native/host-steward/.venv, which `st check` and CI run pytest, Ruff and ty from.
[project]
name = "tether-scripts"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "cryptography==50.0.2",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.6",
    "ty>=0.0.23",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
