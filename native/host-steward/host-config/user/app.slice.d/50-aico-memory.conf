# Memory policy for apps and agents. No MemoryHigh: a fixed throttle bar cut agents off while RAM was free. No
# systemd-oomd kill: oomd only kills a whole leaf cgroup (a whole pane, Aico's scope or the tmux server) picked by
# reclaim rate, not size. A runaway is handled by memctl, the per-pane cap and, as the last line, this slice's cap:
# the kernel then kills one process.
[Slice]
MemoryMax=26G
CPUWeight=50
IOWeight=50
