# User units run at OOMScoreAdjust=200 (agents and apps are OOM-killed before the session); session units may go
# lower because user@.service runs at -500.
# DefaultOOMPolicy=continue: when the kernel kills one process of a unit (a pane, Aico, Aico web, a tmux server, a
# run-* job), systemd keeps the unit running instead of stopping everything in it. A unit whose main process dies
# still ends as before, so Restart= works.
[Manager]
DefaultOOMScoreAdjust=200
DefaultOOMPolicy=continue
