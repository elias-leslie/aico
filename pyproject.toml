[project]
name = "aico-sidecar"
version = "0.1.0"
description = "Aico Python sidecar (FastAPI): /health + per-widget JSONL logging."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]
release = [
    "pyinstaller>=6.20,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["sidecar"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["sidecar/tests"]
