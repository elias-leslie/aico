[project]
name = "aico-scripts"
version = "0.1.1"
description = "Aico's Python test environment: the `st aico` root-watch entry test."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
