# ty from the repo root (how `st check` runs it), with the env of Tether's
# stdlib-only operator scripts.
[environment]
python = "./tether/scripts/.venv"

[src]
include = ["tether/scripts", "scripts"]

[rules]
# Suppress beta-quality rules (ty 0.0.x false positives)
# Remove these as ty matures past 0.1
invalid-argument-type = "ignore"
unknown-argument = "ignore"
unresolved-import = "ignore"
