# ty from the repo root (how `st check` runs it), with the env of the
# stdlib-only host-steward scripts.
[environment]
python = "./native/host-steward/.venv"

[src]
include = ["native/host-steward", "native/pve-sender", "packages/tether/scripts", "scripts"]

[rules]
# Suppress beta-quality rules (ty 0.0.x false positives)
# Remove these as ty matures past 0.1
invalid-argument-type = "ignore"
unknown-argument = "ignore"
unresolved-import = "ignore"
