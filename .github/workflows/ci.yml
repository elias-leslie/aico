name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux build-essential
      - name: Install Node dependencies
        run: npm ci
      - name: Install sidecar dependencies
        run: uv venv --python 3.13 && uv pip install -e '.[dev]'
      - name: Check
        run: npm run check
