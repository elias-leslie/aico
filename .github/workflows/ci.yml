name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Desktop, Tether and web/frontend: one npm workspace, one lockfile.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Install Node dependencies
        run: npm ci
      - name: Check
        run: npm run check

  # The web backend (web/, until it moves to Node) and Tether's operator-script
  # tests, both in web/.venv, run from the root like `st check` does.
  python:
    runs-on: ubuntu-latest
    env:
      A_TERM_BIND_HOST: 127.0.0.1
      A_TERM_AUTH_MODE: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install Python dependencies
        run: uv sync --locked --extra dev --directory web
      - name: Ruff
        run: web/.venv/bin/ruff check .
      - name: Ty
        run: web/.venv/bin/ty check
      - name: Pytest
        run: web/.venv/bin/pytest -q
