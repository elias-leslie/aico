name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach release assets to
        required: true

# Default for every job: read-only. Only the publish job, which runs no
# dependency installs or project code, receives write and attestation scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Verify the release tag exists and is the checked-out commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "::error::Release tag '$TAG' must start with v and contain only [0-9A-Za-z._+-]"
            exit 1
          fi
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")" || {
            echo "::error::Tag '$TAG' does not exist; create and push it before releasing"
            exit 1
          }
          type="$(jq -r .object.type <<<"$ref")"
          sha="$(jq -r .object.sha <<<"$ref")"
          if [ "$type" = tag ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .object.sha)"
          fi
          head="$(git rev-parse HEAD)"
          if [ "$sha" != "$head" ]; then
            echo "::error::Tag '$TAG' resolves to $sha but the checked-out commit is $head"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux build-essential xvfb xauth x11-utils dbus-x11
      - name: Install Node dependencies
        run: npm ci
      - name: Install sidecar build dependencies
        run: uv sync --frozen --python 3.13 --extra dev --extra release
      - name: Check
        run: npm run check
      - name: Build AppImage
        # AppImage tooling runs without FUSE on CI runners via extract-and-run.
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run dist
      - name: Smoke built AppImage on isolated Xvfb display
        run: bash scripts/aico-packaged-smoke.sh dist/electron/Aico-*.AppImage
      - name: Generate checksums
        working-directory: dist/electron
        run: |
          sha256sum Aico-*.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-appimage
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/electron/Aico-*.AppImage
            dist/electron/SHA256SUMS.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-appimage
          path: dist/electron
      - name: Verify checksums
        working-directory: dist/electron
        run: sha256sum -c SHA256SUMS.txt
      - name: Verify the tag still resolves to the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          type="$(jq -r .object.type <<<"$ref")"
          sha="$(jq -r .object.sha <<<"$ref")"
          if [ "$type" = tag ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .object.sha)"
          fi
          if [ "$sha" != "$BUILT_SHA" ]; then
            echo "::error::Tag '$TAG' moved to $sha after building $BUILT_SHA"
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/electron/Aico-*.AppImage
      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/electron/Aico-*.AppImage
            dist/electron/SHA256SUMS.txt
