# Python here is only the operator scripts (scripts/*.py: the `st aico` root client
# and the Codex admin qualification, both owned here since the cutover) and
# their fixture tests. Tether itself is TypeScript (package.json).
[project]
name = "tether-scripts"
version = "0.0.1"
description = "Tether operator scripts: root watch/create CLI and Codex admin qualification."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=7.1.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
