# Agent pane memory policy. Panes are never throttled by a fixed MemoryHigh:
# MemoryMax is only a runaway backstop, and MemorySwapMax keeps one pane from
# filling swap. Memory-pressure kills are systemd-oomd's job at app.slice
# (Nightshift's policy). Tether gives the focused pane MemoryLow=2G at runtime.
[Scope]
MemoryMax=16G
MemorySwapMax=3G
