# Nightly deep lane (st check --deep): Tether's live containment proof against a
# throwaway tether@dev instance (refuses the default one). It starts the
# instance only if it is down and stops it again; the smoke starts a real Codex
# TUI but never submits a prompt, so no model request is made.
[[deep.stages]]
id = "gradle-android"
argv = ["bash", "-c", "export ANDROID_HOME=\"${ANDROID_HOME:-/home/kasadis/Android/Sdk}\"; export PATH=/usr/bin:/bin:$PATH; export GRADLE_USER_HOME=\"${GRADLE_USER_HOME:-/home/kasadis/.gradle}\"; if [ ! -w \"$GRADLE_USER_HOME\" ]; then rm -rf \"${TMPDIR:-/tmp}/gradle-home\"; mkdir -p \"${TMPDIR:-/tmp}/gradle-home\" && cp -aL --reflink=auto \"$GRADLE_USER_HOME/caches\" \"$GRADLE_USER_HOME/wrapper\" \"${TMPDIR:-/tmp}/gradle-home/\" && export GRADLE_USER_HOME=\"${TMPDIR:-/tmp}/gradle-home\"; fi; cd native/android && nice -n 19 ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m -Dkotlin.compiler.execution.strategy=in-process --max-workers=2 clean test --offline --console=plain"]
timeout_seconds = 900

# Nightly whole-repo build: `tsc -b --force` ignores the incremental cache and the
# workspace builds produce the tether and aico-web bundles and the static web
# export, which the commit gate never builds. Writes only dist/, out/ and .tsbuild
# in the checkout; no service, instance or credential is touched. It runs in the main
# checkout (AICO_MAIN_CHECKOUT): next build cannot resolve the linked node_modules of
# the nightly's clean worktree. The live-smoke stage above runs on tether@dev and sends
# one short prompt per agent tool to its real model.
[[deep.stages]]
id = "repo-build"
argv = ["bash", "-c", "set -e; cd \"$AICO_MAIN_CHECKOUT\"; npm run typecheck -- --force; npm run build"]
timeout_seconds = 900
