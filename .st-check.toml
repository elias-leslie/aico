# One gate for the whole repo: packages/* (TypeScript), native/* (Python and
# shell) and the root scripts. Prepare once: `npm ci` at the root and
# `uv sync --locked --directory native/host-steward` for the Python env of the
# host-steward scripts and their tests.
#
# The tools run from the root: Ruff and Biome pick up nested config, ty reads
# ty.toml, pytest reads pytest.ini (native/host-steward/tests), Vitest's root
# config runs one project per package, and `tsc -b` builds every package from
# the root solution tsconfig (project references); it runs in the quick lane
# too (`quick = true`) when a TypeScript or JSON file changed.
[paths]
pytest = "native/host-steward/.venv/bin"
types = "native/host-steward/.venv/bin"
ruff = "native/host-steward/.venv/bin"

[native]
schema_version = 1
locks = ["package-lock.json", "native/host-steward/pyproject.toml", "native/host-steward/uv.lock"]
paths = ["node_modules/.bin"]
environment_inputs = ["node_modules"]
legacy_tools = ["ruff", "types", "pytest", "biome", "tsc", "vitest", "security"]

# uilint runs from its checkout (st uilint is the same CLI); its package is a
# prepared input so isolated acceptance can import it.
managed_environment_inputs = ["/srv/workspaces/projects/uilint/bin", "/srv/workspaces/projects/uilint/uilint"]

[native.tools]
node = "/usr/local/bin/node"
python3 = "/usr/bin/python3"

[[native.stages]]
id = "tsc"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["**/*.ts", "**/*.tsx", "**/*.mts", "**/*.cts", "**/*.json"]
argv = ["node_modules/.bin/tsc", "-b"]

# Mechanical UI copy rules from ui-spec.json (uilint). A pass is not a copy review.
[[native.stages]]
id = "ui-spec"
kind = "check"
coverage = "full"
argv = ["python3", "/srv/workspaces/projects/uilint/bin/uilint", "check-source", "--spec", "ui-spec.json"]
timeout_seconds = 120

# Nightly deep lane (st check --deep): Tether's live containment proof against a
# throwaway tether@dev instance (refuses the default one). It starts the
# instance only if it is down and stops it again; the smoke starts a real Codex
# TUI but never submits a prompt, so no model request is made.
[[deep.stages]]
id = "tether-live-containment"
argv = ["bash", "-c", "set -e; started=; if ! systemctl --user is-active -q tether@dev.service; then systemctl --user --no-ask-password start tether@dev.service; started=1; fi; trap '[ -n \"$started\" ] && systemctl --user --no-ask-password stop tether@dev.service' EXIT; for i in $(seq 50); do [ -S \"${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/tether/dev/control.sock\" ] && break; sleep 0.2; done; bash scripts/live/tether-lifecycle-harness.sh dev; bash scripts/live/tether-real-session-smoke.sh dev codex"]
timeout_seconds = 600
