# One gate for the whole repo: packages/* (TypeScript), native/* (Python and
# shell) and the root scripts. Prepare once: `npm ci` at the root and
# `uv sync --locked --directory native/host-steward` for the Python env of the
# host-steward scripts and their tests.
#
# The tools run from the root: Ruff and Biome pick up nested config, ty reads
# ty.toml, pytest reads pytest.ini (native/host-steward/tests), Vitest's root
# config runs one project per package, and `tsc -b` builds every package from
# the root solution tsconfig (project references); it runs in the quick lane
# too (`quick = true`) when a TypeScript or JSON file changed.
[paths]
pytest = "native/host-steward/.venv/bin"
types = "native/host-steward/.venv/bin"
ruff = "native/host-steward/.venv/bin"

[native]
schema_version = 1
locks = ["package-lock.json", "native/host-steward/pyproject.toml", "native/host-steward/uv.lock", "native/st-sdk/pyproject.toml", "native/st-sdk/uv.lock", "native/service-tools/pyproject.toml", "native/service-tools/uv.lock"]
# Declare script-internal Python environments so isolated acceptance prepares them.
paths = ["node_modules/.bin", "native/st-sdk/.venv/bin", "native/service-tools/.venv/bin"]
environment_inputs = ["node_modules", "native/st-sdk/.venv", "native/host-steward/.venv", "native/service-tools/.venv"]
legacy_tools = ["vitest", "security"]

[native.tools]
bash = "/usr/bin/bash"
node = "/usr/local/bin/node"
python3 = "/usr/bin/python3"
openssl = "/usr/bin/openssl"
mktemp = "/usr/bin/mktemp"
rm = "/usr/bin/rm"
git = "/usr/bin/git"

# The whole-repo stages below are the full gate. The generated per-package stages
# further down are quick views of them (`covered_by`): they run only in
# `st check --quick`, for the package a change touches and the packages that
# depend on it. Vitest stays a legacy tool: the quick lane runs `vitest related`
# on the changed files (follows imports across packages) and the full gate runs
# every project once, so it has no per-package stage.
[[native.stages]]
id = "python-host-ruff"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["native/host-steward/**", "native/pve-sender/**", "native/git-outgoing/**", "packages/tether/scripts/**", "scripts/**", "ruff.toml"]
argv = ["native/host-steward/.venv/bin/ruff", "check", "native/host-steward", "native/pve-sender", "native/git-outgoing", "packages/tether/scripts", "scripts"]

[[native.stages]]
id = "python-host-types"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["native/host-steward/**", "native/pve-sender/**", "native/git-outgoing/**", "packages/tether/scripts/**", "scripts/**", "ty.toml"]
argv = ["native/host-steward/.venv/bin/ty", "check"]

[[native.stages]]
id = "python-host-tests"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["native/host-steward/**", "native/pve-sender/**", "native/git-outgoing/**", "packages/tether/scripts/**", "scripts/**", "pytest.ini"]
argv = ["bash", "-c", "set -e; test_tmp=$(mktemp -d /tmp/aico-pytest.XXXXXX); trap 'rm -rf -- \"$test_tmp\"' EXIT; native/host-steward/.venv/bin/pytest --basetemp \"$test_tmp\" -q native/host-steward/tests native/git-outgoing/tests"]

[[native.stages]]
id = "tsc"
kind = "check"
coverage = "full"
argv = ["node_modules/.bin/tsc", "-b"]

[[native.stages]]
id = "biome"
kind = "check"
coverage = "full"
argv = ["node_modules/.bin/biome", "check", "."]

# Package boundaries: .dependency-cruiser.cjs reads the layer data in each
# package.json; known violations are in .dependency-cruiser-known-violations.json.
[[native.stages]]
id = "depcruise"
kind = "check"
coverage = "full"
argv = ["node_modules/.bin/depcruise", "packages", "--config", ".dependency-cruiser.cjs", "--ignore-known"]
timeout_seconds = 180

# Exact-pinned deps, one owner per DB file, declared imports, contracts fixtures,
# and the generated stages below are not stale.
[[native.stages]]
id = "boundaries"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["packages/**", "contracts/**", "native/**", "scripts/**", "package.json", "package-lock.json", "biome.json", ".st-check.toml"]
argv = ["node", "scripts/boundaries.mjs"]
timeout_seconds = 120

# Mechanical UI copy rules from ui-spec.json (uilint). A pass is not a copy review.
[[native.stages]]
id = "ui-spec"
kind = "check"
coverage = "full"
argv = ["python3", "/srv/workspaces/projects/uilint/bin/uilint", "check-source", "--spec", "ui-spec.json"]
timeout_seconds = 120

# Debt guards (packages/checks/src/guards.ts): a new suppression or skipped test with no reason on
# its line, and a new Fallow dead-code finding. The known ones are in .suppressions-baseline.json
# and .fallow-baseline.json (`node packages/checks/src/guards.ts suppressions|dead-code --update`
# rewrites them). The quick lane checks the changed files only; the full gate the whole tree.
[[native.stages]]
id = "suppressions"
kind = "check"
coverage = "full"
quick = true
argv = ["node", "packages/checks/src/guards.ts", "suppressions"]
timeout_seconds = 60

[[native.stages]]
id = "dead-code"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs", "**/package.json", ".fallowrc.json", ".fallow-baseline.json"]
argv = ["node", "packages/checks/src/guards.ts", "dead-code"]
timeout_seconds = 60

# The three native stages below (android, tray, hook) declare `inputs`: the full gate reuses their last pass
# while those paths are unchanged, so a TypeScript-only change doesn't pay ~70 s of cold Gradle, cargo and Go builds.
# Each runs in its own directory (cwd): a stage at the repo root also binds every node_modules and venv, so a
# lockfile change anywhere would rerun it.
# The phone app's unit tests (native/android, Kotlin). Gradle runs offline from the cached wrapper
# and dependencies, at low priority; the SDK is the one in ~/Android/Sdk unless ANDROID_HOME says
# otherwise. Release signing is not touched (no keystore needed to test).
[[native.stages]]
id = "gradle-android"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["native/android/**"]
inputs = ["native/android", "contracts"]
cwd = "native/android"
argv = ["bash", "-c", "export ANDROID_HOME=\"${ANDROID_HOME:-/home/kasadis/Android/Sdk}\"; export PATH=/usr/bin:/bin:$PATH; export GRADLE_USER_HOME=\"${GRADLE_USER_HOME:-/home/kasadis/.gradle}\"; if [ ! -w \"$GRADLE_USER_HOME\" ]; then rm -rf \"${TMPDIR:-/tmp}/gradle-home\"; mkdir -p \"${TMPDIR:-/tmp}/gradle-home\" && cp -aL --reflink=auto \"$GRADLE_USER_HOME/caches\" \"$GRADLE_USER_HOME/wrapper\" \"${TMPDIR:-/tmp}/gradle-home/\" && export GRADLE_USER_HOME=\"${TMPDIR:-/tmp}/gradle-home\"; fi; nice -n 19 ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx1536m -Dkotlin.compiler.execution.strategy=in-process --max-workers=2 test --offline --console=plain"]
timeout_seconds = 600

# The tray's Rust tests and lints (native/tray, cargo). The compiler is the one rust-toolchain.toml pins (rustup under
# CARGO_HOME/RUSTUP_HOME, the owner's by default: the stage's own HOME is the repo); builds go to a cache dir shared
# with native/tray/install.sh, at low priority.
[[native.stages]]
id = "cargo-tray"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["native/tray/**", "packages/web-server/src/tray.ts"]
inputs = ["native/tray", "packages/web-server/src/tray.ts"]
cwd = "native/tray"
argv = ["bash", "-c", "export PATH=/usr/bin:/bin:$PATH; export CARGO_HOME=\"${CARGO_HOME:-/home/kasadis/.cargo}\" RUSTUP_HOME=\"${RUSTUP_HOME:-/home/kasadis/.rustup}\"; export PATH=\"$CARGO_HOME/bin:$PATH\" CARGO_TARGET_DIR=\"${CARGO_TARGET_DIR:-/home/kasadis/.cache/aico-tray/target}\"; if [ ! -w \"$CARGO_TARGET_DIR\" ] || [ ! -w \"$CARGO_HOME\" ]; then T=\"${TMPDIR:-/tmp}/aico-tray-cargo\"; rm -rf \"$T\"; mkdir -p \"$T/home\" && ln -s \"$CARGO_HOME/registry\" \"$CARGO_HOME/git\" \"$T/home/\"; if [ ! -w \"$CARGO_TARGET_DIR\" ]; then cp -aL --reflink=auto \"$CARGO_TARGET_DIR\" \"$T/target\" 2>/dev/null || mkdir -p \"$T/target\"; export CARGO_TARGET_DIR=\"$T/target\"; fi; export CARGO_HOME=\"$T/home\" CARGO_NET_OFFLINE=true; fi; nice -n 19 cargo clippy --all-targets --locked -- -D warnings && nice -n 19 cargo test --locked"]
timeout_seconds = 900

# aico-hook's vet and tests (native/hook, Go; no third-party modules). The build cache is the owner's unless it
# is read-only (isolated acceptance), then a temp one. contracts/** holds the hook payloads and the guard corpus.
[[native.stages]]
id = "go-hook"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["native/hook/**", "contracts/**"]
inputs = ["native/hook", "contracts"]
cwd = "native/hook"
argv = ["bash", "-c", "export PATH=/usr/bin:/bin:$PATH GOTOOLCHAIN=local GOFLAGS=-mod=readonly; export GOCACHE=\"${GOCACHE:-/home/kasadis/.cache/go-build}\" GOPATH=\"${GOPATH:-/home/kasadis/go}\"; if [ ! -w \"$GOCACHE\" ]; then export GOCACHE=\"${TMPDIR:-/tmp}/aico-hook-gocache\"; fi; if [ ! -w \"$GOPATH\" ]; then export GOPATH=\"${TMPDIR:-/tmp}/aico-hook-gopath\"; fi; nice -n 19 go vet ./... && nice -n 19 go test ./..."]
timeout_seconds = 300


[[native.stages]]
id = "python-st-sdk"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["native/st-sdk/**", "contracts/**"]
inputs = ["native/st-sdk", "contracts"]
argv = ["bash", "native/st-sdk/check.sh"]


[[native.stages]]
id = "python-service-tools"
kind = "check"
coverage = "full"
quick = true
quick_paths = ["native/service-tools/**"]
inputs = ["native/service-tools"]
argv = ["bash", "native/service-tools/check.sh"]

# Nightly deep lane (`aico nightly`, the check-nightly job): after the full gate on HEAD, the live
# session checks against a throwaway tether@dev (scripts/live/with-dev.sh starts and stops it).
# The containment harness and real-session smoke never submit a prompt; live-smoke sends one
# short prompt per installed agent on a cheap model. Each runs with the caller's environment.
[[deep.stages]]
id = "tether-containment"
argv = ["bash", "scripts/live/with-dev.sh", "bash", "scripts/live/tether-lifecycle-harness.sh", "dev"]
timeout_seconds = 600

[[deep.stages]]
id = "tether-real-session"
argv = ["bash", "scripts/live/with-dev.sh", "bash", "scripts/live/tether-real-session-smoke.sh", "dev", "codex"]
timeout_seconds = 600

[[deep.stages]]
id = "live-smoke"
argv = ["bash", "scripts/live/with-dev.sh", "env", "TETHER_INSTANCE=dev", "bash", "scripts/live/live-smoke.sh"]
timeout_seconds = 900

