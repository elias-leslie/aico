# One gate for the three parts of this repo: the desktop at the root, Tether in
# tether/ and the web app in web/ (web/server and web/frontend). Prepare once:
# `npm ci` at the root and `uv sync --locked --directory tether/scripts` for
# the Python env of Tether's operator scripts and their tests.
#
# The tools run from the root: Ruff and Biome pick up each part's nested config,
# ty reads ty.toml, pytest reads pytest.ini (tether/scripts/tests),
# Vitest's root config runs the desktop, Tether, web/server and web/frontend
# projects, and tsc checks the desktop. Tether, web/server and web/frontend each
# have their own tsconfig, so they type-check in the native stages below.
[paths]
pytest = "tether/scripts/.venv/bin"
types = "tether/scripts/.venv/bin"
ruff = "tether/scripts/.venv/bin"

[native]
schema_version = 1
locks = ["package-lock.json", "tether/scripts/pyproject.toml", "tether/scripts/uv.lock"]
paths = ["node_modules/.bin"]
environment_inputs = ["node_modules"]
legacy_tools = ["ruff", "types", "pytest", "biome", "tsc", "vitest", "security"]

# uilint runs from its checkout (st uilint is the same CLI); its package is a
# prepared input so isolated acceptance can import it.
managed_environment_inputs = ["/srv/workspaces/projects/uilint/bin", "/srv/workspaces/projects/uilint/uilint"]

[native.tools]
node = "/usr/local/bin/node"
python3 = "/usr/bin/python3"

[[native.stages]]
id = "tether-tsc"
kind = "check"
coverage = "full"
argv = ["node_modules/.bin/tsc", "--noEmit", "-p", "tether"]

[[native.stages]]
id = "web-tsc"
kind = "check"
coverage = "full"
argv = ["node_modules/.bin/tsc", "--noEmit", "-p", "web/frontend"]

[[native.stages]]
id = "web-server-tsc"
kind = "check"
coverage = "full"
argv = ["node_modules/.bin/tsc", "--noEmit", "-p", "web/server"]

# Mechanical UI copy rules from ui-spec.json (uilint). A pass is not a copy review.
[[native.stages]]
id = "ui-spec"
kind = "check"
coverage = "full"
argv = ["python3", "/srv/workspaces/projects/uilint/bin/uilint", "check-source", "--spec", "ui-spec.json"]
timeout_seconds = 120
